<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bozorly.uz</title>
  <style>
    :root {
      --bg: #ffffff;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --accent: #00b96b;
      --accent-hover: #009958;
      --sale-red: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: left;
    }

    /* Minimal, professional status line */
    .status-line {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--sale-red);
      border-radius: 50%;
      position: relative;
    }

    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid var(--sale-red);
      opacity: 0.4;
    }

    .status-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sale-red);
    }

    .domain-title {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 1;
    }

    .domain-title span {
      color: var(--accent);
    }

    .subtext {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 400;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      padding: 16px 24px;
      border-radius: 12px;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    .cta-button:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .cta-button svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    @media (max-width: 480px) {
      .domain-title {
        font-size: 40px;
      }
      .subtext {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

    </div>
